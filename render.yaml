services:
  - type: web
    name: quacktrack
    env: node
    plan: standard
    
    # Build & Start Commands
    buildCommand: npm install && npm run build
    startCommand: npm start
    
    # Port Configuration
    port: 3000
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quacktrack
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    
    # Health Check
    healthCheckPath: /
    
    # Auto-deploy
    autoDeploy: true
